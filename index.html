                    </div>

                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 w-4 h-4 pointer-events-none"></i>
                    </div>

                </div>
                
                <!-- Display Count Indicator -->

            // Mengumpulkan data unik dari dataAkreditasi
            dataAkreditasi.forEach(item => {
                if(item.jenjang) jenjangSet.add(item.jenjang);
                if(item.internasional) {
                    item.internasional.forEach(intl => lembagaSet.add(intl.nama));
                }
            });

            // Memasukkan ke opsi Jenjang dan urutkan
            Array.from(jenjangSet).sort().forEach(j => {
                filterJenjang.insertAdjacentHTML('beforeend', `<option value="${j}">${j}</option>`);
            });

            // Memasukkan ke opsi Lembaga Internasional dan urutkan
            Array.from(lembagaSet).sort().forEach(l => {
                filterLembaga.insertAdjacentHTML('beforeend', `<option value="${l}">${l}</option>`);
            });
        }

        // Fungsi untuk merender tabel
        function renderTable(data) {
            let html = '';
            
            if (data.length === 0) {
                html = `
                    <tr>
                        <td colspan="6" class="px-5 py-12 text-center text-slate-500">
                            <div class="flex flex-col items-center justify-center gap-2">
                                <i data-lucide="search" class="w-8 h-8 text-slate-300"></i>
                                <p>Tidak ada data program studi yang cocok dengan pencarian.</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                data.forEach((item, index) => {
                    item.internasional.forEach((intl, idx) => {
                        // Tentukan style border bawah untuk mengelompokkan row
                        const isLastIntl = idx === item.internasional.length - 1;
                        const borderClass = isLastIntl ? 'border-b-2 border-slate-200' : 'border-b border-slate-100';
                        
                        html += `<tr class="hover:bg-slate-50 transition-colors ${borderClass}">`;
                        
                        // Kolom identitas Program Studi hanya dirender di baris pertama
                        if (idx === 0) {
                            const rowSpan = item.internasional.length;
                            html += `
                                <td rowspan="${rowSpan}" class="px-5 py-4 text-center font-medium text-slate-500">${index + 1}</td>
                                <td rowspan="${rowSpan}" class="px-5 py-4 align-top">
                                    <div class="font-bold text-slate-900 text-base">${item.nama}</div>
                                    <div class="text-xs text-slate-500 mt-1 font-mono">Kode: ${item.kode}</div>
                                </td>
                                <td rowspan="${rowSpan}" class="px-5 py-4 align-top text-center">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">
                                        ${item.jenjang}
                                    </span>
                                </td>
                                <td rowspan="${rowSpan}" class="px-5 py-4 align-top">
                                    <div class="flex items-center gap-1 font-bold text-emerald-700">
                                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                                        ${item.peringkatNasional}
                                    </div>
                                    <div class="text-xs text-slate-600 mt-1 max-w-[200px] truncate" title="${item.skNasional}">
                                        SK: ${item.skNasional}
                                    </div>
                                    <div class="text-xs text-slate-500 mt-1">
                                        ${item.masaNasional}
                                    </div>
                                </td>
                            `;
                        }

                        // Kolom Akreditasi Internasional (dirender per sertifikat)
                        html += `
                            <td class="px-5 py-4 border-l border-slate-100 align-middle">
                                <div class="font-bold text-blue-700">${intl.nama}</div>
                                <div class="text-xs text-slate-500 mt-1">${intl.masa}</div>
                            </td>
                            <td class="px-5 py-4 align-middle text-center">
                                <a href="${intl.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white rounded-lg text-xs font-semibold transition-all shadow-sm border border-blue-200 hover:border-blue-600">
                                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                                    Unduh
                                </a>
                            </td>
                        </tr>`;
                    });
                });
            }

            // Memasukkan html ke tbody
            tableBody.innerHTML = html;
            
            // Update jumlah data
            countDisplay.textContent = data.length;
            
            // Re-inisialisasi icon Lucide untuk elemen yang baru dirender
            lucide.createIcons();
        }

        // Fungsi Filter Gabungan (Pencarian & Dropdown)
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedJenjang = filterJenjang.value;
            const selectedLembaga = filterLembaga.value;
            
            const filteredData = dataAkreditasi.filter(item => {
                // 1. Filter Pencarian Teks
                const matchSearch = item.nama.toLowerCase().includes(searchTerm) || 
                                    item.kode.includes(searchTerm) ||
                                    item.internasional.some(intl => intl.nama.toLowerCase().includes(searchTerm));
                
                // 2. Filter Dropdown Jenjang
                const matchJenjang = selectedJenjang === "" || item.jenjang === selectedJenjang;

                // 3. Filter Dropdown Lembaga Akreditasi Internasional
                const matchLembaga = selectedLembaga === "" || item.internasional.some(intl => intl.nama === selectedLembaga);

                // Kembalikan data hanya jika memenuhi SEMUA kondisi di atas (AND logic)
                return matchSearch && matchJenjang && matchLembaga;
            });
            
            renderTable(filteredData);
        }

        // Event Listeners untuk semua filter
        searchInput.addEventListener('input', applyFilters);
        filterJenjang.addEventListener('change', applyFilters);
        filterLembaga.addEventListener('change', applyFilters);

        // Inisialisasi awal saat load
        initFilters();
        applyFilters();
    </script>
</body>
</html>
